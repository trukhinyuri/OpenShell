# Endpoint settings for policy-template.cedar, passed with --middleware when
# POLICY_FORMAT=cedar. They are the `mcp` options of the YAML endpoint, which
# configure inspection rather than grant access. render-policy.py substitutes
# the placeholders.

endpoint_settings:
  - host: ${host_json}
    port: ${port}
    mcp:
      versions: [${mcp_version}]
      max_body_bytes: 131072
